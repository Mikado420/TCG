<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Shape -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Outer Arcana Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />
  
  <!-- Inner Shield / Card Crest -->
  <path d="M 256 100 L 370 160 L 370 280 C 370 360 256 410 256 410 C 256 410 142 360 142 280 L 142 160 Z" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Crossed Swords & Magic Gem -->
  <path d="M 256 160 L 290 230 L 256 320 L 222 230 Z" fill="url(#gemGrad)" stroke="#38bdf8" stroke-width="3" />
  <circle cx="256" cy="240" r="18" fill="#e0f2fe" filter="url(#glow)" />
  
  <!-- Arcana Flames -->
  <path d="M 256 130 Q 270 170 256 195 Q 242 170 256 130 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M 200 320 L 312 320" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
</svg>
